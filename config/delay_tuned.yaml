# 지연 0.2~0.3 s 대응 후보값 (2026-11-25, sim/sim_eval.py 결과). params.yaml 위에 덮어쓴다.
# 시뮬(f1sim_ms 차량 0.58 x 0.31 m, 통로 1.5 m, 박스 맵 3종 + 빈 맵, 잡음 3 cm)에서만 확인한 값이다.
# 실차에서는 이 값으로 시작해 속도를 조금씩 올린다.
#
# 결과 (완주/시도, 평균 랩타임)          지연 0      0.2        0.25       0.3
#   gap 기본값 1.0 m/s                     8/8 43s    1/8        1/8        0/8
#   gap 0.7 m/s + 조향 변화율 180°/s       8/8 56s    8/8 61s    8/8 64s    8/8 67s
#   wall 기본값                            2/2 46s    1/2        0/2        0/2
#   wall 0.6/0.5/0.4 m/s + 코너 2.5 m      2/2 63s    2/2 64s    2/2 64s    2/2 65s
#
# 조향 변화율은 mode_manager.max_steer_rate_deg (팀 safe.yaml, 총괄 담당) 이다. 90 → 180 제안.

gap_follow:
  ros__parameters:
    max_speed: 0.7

wall_follow:
  ros__parameters:
    speeds: [0.6, 0.5, 0.4]
    corner_front_dist: 2.5
