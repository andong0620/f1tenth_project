# 지연 0.2~0.3 s 대응 후보값 (2026-11-26 다시 계산, sim/sim_eval.py). params.yaml 위에 덮어쓴다.
# 조건: f1sim_ms 기본 차량 (RoboRacer 표준 차체: 축간 0.33 m, 0.58 x 0.31 m, 최대 조향 24°),
#       LiDAR 는 후륜축에서 0.275 m 앞 (f1sim_ms ROS 브리지와 같다. 우리 차는 실측 필요),
#       통로 1.5 m, 박스 맵 3종 + 빈 맵, 거리 잡음 3 cm, mode_manager 출력 제한.
#
# 결과 (완주/시도, 평균 랩타임)                  지연 0      0.2        0.25       0.3
#   gap 기본값 1.0 m/s                             6/8 43s    1/8        0/8        0/8
#   gap 0.7 m/s + 조향 180°/s                      8/8 56s    7/8        6/8        5/8
#   gap 0.7 m/s + 조향 180°/s + half_width 0.35    8/8 55s    8/8 60s    8/8 62s    7/8 64s
#   wall 기본값 (1.0/0.7/0.4, 코너 2.0 m)           4/4        4/4        4/4        4/4
#   wall 코너 2.5 m (11/25 제안, 철회)              0/2        2/2        1/2        0/2
#
# 11/25 버전은 LiDAR 를 후륜축 위에 둔 계산이라 틀렸다. LiDAR 가 앞에 있으면 앞쪽이 모서리를
# 지나자마자 꺾어서 뒷부분이 안쪽 모서리를 긁는다. 그래서 gap 은 half_width 를 키우고,
# wall 은 corner_front_dist 를 키우지 않는다 (기본값 유지).
# 조향 변화율은 mode_manager.max_steer_rate_deg (팀 safe.yaml, 총괄 담당) 이다. 90 → 180 제안.

gap_follow:
  ros__parameters:
    max_speed: 0.7
    half_width: 0.35
